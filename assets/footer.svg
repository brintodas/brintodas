<svg width="900" height="80" viewBox="0 0 900 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0"/>
      <stop offset="20%" stop-color="#e2e8f0"/>
      <stop offset="80%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rc">
      <rect width="900" height="80" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rc)">
    <rect width="900" height="80" fill="url(#bg)"/>
    <rect x="0" y="0" width="5" height="80" fill="url(#accentBar)"/>

    <rect x="36" y="22" width="828" height="1" fill="url(#rule)"/>

    <text x="450" y="47"
      font-family="Inter, system-ui, sans-serif"
      font-size="13"
      fill="#94a3b8"
      text-anchor="middle"
      letter-spacing="0.3">Thanks for stopping by — let's build something together.</text>

    <rect x="36" y="58" width="828" height="1" fill="url(#rule)"/>

    <rect width="900" height="80" rx="16" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  </g>
</svg>
