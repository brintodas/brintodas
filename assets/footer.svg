<svg width="900" height="100" viewBox="0 0 900 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020510"/>
      <stop offset="50%" stop-color="#060d1f"/>
      <stop offset="100%" stop-color="#020510"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="lineShimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#020510" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020510" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="900" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020510" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.7" fill="#818cf8" opacity="0.2"/>
    </pattern>
    <clipPath id="rc">
      <rect width="900" height="100" rx="18"/>
    </clipPath>
    <filter id="textGlow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#rc)">
    <rect width="900" height="100" fill="url(#bg)"/>
    <rect width="900" height="100" fill="url(#glowCenter)"/>
    <rect width="900" height="100" fill="url(#dots)"/>

    <!-- Top shimmer line -->
    <rect x="100" y="18" width="700" height="1" rx="0.5" fill="url(#lineShimmer)"/>

    <!-- Main text -->
    <text x="450" y="58"
      font-family="'Courier New', Courier, monospace"
      font-size="11"
      fill="#64748b"
      text-anchor="middle"
      letter-spacing="5">THANKS FOR STOPPING BY</text>

    <text x="450" y="76"
      font-family="'Segoe UI', 'Inter', Arial, sans-serif"
      font-size="16"
      font-weight="700"
      fill="url(#textGrad)"
      text-anchor="middle"
      letter-spacing="1"
      filter="url(#textGlow)">Let's build something great together.</text>

    <!-- Bottom shimmer line -->
    <rect x="100" y="88" width="700" height="1" rx="0.5" fill="url(#lineShimmer)"/>

    <!-- Corner dots -->
    <circle cx="30" cy="20" r="2" fill="#38bdf8" opacity="0.7"/>
    <circle cx="870" cy="20" r="2" fill="#c084fc" opacity="0.7"/>
    <circle cx="30" cy="80" r="2" fill="#38bdf8" opacity="0.7"/>
    <circle cx="870" cy="80" r="2" fill="#c084fc" opacity="0.7"/>

    <!-- Border -->
    <rect width="900" height="100" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="1"/>
  </g>
</svg>
