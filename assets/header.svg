<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="subtleRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0"/>
      <stop offset="20%" stop-color="#e2e8f0"/>
      <stop offset="80%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#64748b" flood-opacity="0.08"/>
    </filter>
    <clipPath id="rc">
      <rect width="900" height="220" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rc)" filter="url(#shadow)">
    <!-- Background -->
    <rect width="900" height="220" fill="url(#bg)"/>

    <!-- Left accent bar -->
    <rect x="0" y="0" width="5" height="220" fill="url(#accentBar)"/>

    <!-- Subtle grid dots -->
    <circle cx="860" cy="40"  r="1.2" fill="#e2e8f0"/>
    <circle cx="880" cy="40"  r="1.2" fill="#e2e8f0"/>
    <circle cx="860" cy="60"  r="1.2" fill="#e2e8f0"/>
    <circle cx="880" cy="60"  r="1.2" fill="#e2e8f0"/>
    <circle cx="860" cy="80"  r="1.2" fill="#e2e8f0"/>
    <circle cx="880" cy="80"  r="1.2" fill="#e2e8f0"/>
    <circle cx="860" cy="100" r="1.2" fill="#e2e8f0"/>
    <circle cx="880" cy="100" r="1.2" fill="#e2e8f0"/>
    <circle cx="860" cy="120" r="1.2" fill="#e2e8f0"/>
    <circle cx="880" cy="120" r="1.2" fill="#e2e8f0"/>
    <circle cx="860" cy="140" r="1.2" fill="#e2e8f0"/>
    <circle cx="880" cy="140" r="1.2" fill="#e2e8f0"/>
    <circle cx="860" cy="160" r="1.2" fill="#e2e8f0"/>
    <circle cx="880" cy="160" r="1.2" fill="#e2e8f0"/>
    <circle cx="860" cy="180" r="1.2" fill="#e2e8f0"/>
    <circle cx="880" cy="180" r="1.2" fill="#e2e8f0"/>

    <!-- Status chip -->
    <rect x="36" y="30" width="148" height="24" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <circle cx="52" cy="42" r="4.5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="63" y="46.5" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#166534" font-weight="600" letter-spacing="0.5">Open to opportunities</text>

    <!-- BRINTO DAS -->
    <text x="36" y="102"
      font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
      font-size="52"
      font-weight="800"
      fill="url(#nameGrad)"
      letter-spacing="-1.5">Brinto Das</text>

    <!-- Thin rule under name -->
    <rect x="36" y="110" width="460" height="1" fill="url(#subtleRule)"/>

    <!-- Role line -->
    <text x="36" y="138"
      font-family="Inter, system-ui, sans-serif"
      font-size="15"
      fill="#6366f1"
      font-weight="600"
      letter-spacing="0.3">Computer Science Student &amp; Web Developer</text>

    <!-- Bio line -->
    <text x="36" y="162"
      font-family="Inter, system-ui, sans-serif"
      font-size="13.5"
      fill="#64748b"
      letter-spacing="0.2">Learning every day. Building every day.</text>

    <!-- Divider -->
    <rect x="36" y="182" width="280" height="1" fill="#e2e8f0"/>

    <!-- Bottom meta row -->
    <!-- Location pin icon area -->
    <text x="36" y="200" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94a3b8">📍 Bangladesh</text>
    <text x="160" y="200" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94a3b8">🎓 CSE Student</text>
    <text x="280" y="200" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94a3b8">🚀 Building Flatfolks</text>

    <!-- Right side — large stylized initial / monogram block -->
    <rect x="700" y="50" width="140" height="130" rx="12" fill="#f1f5f9"/>
    <text x="770" y="148"
      font-family="Inter, 'Helvetica Neue', sans-serif"
      font-size="88"
      font-weight="900"
      fill="#e2e8f0"
      text-anchor="middle"
      letter-spacing="-4">B</text>
    <text x="770" y="100"
      font-family="'Courier New', monospace"
      font-size="10"
      fill="#94a3b8"
      text-anchor="middle"
      letter-spacing="3">PORTFOLIO</text>
    <text x="770" y="162"
      font-family="Inter, sans-serif"
      font-size="11"
      font-weight="700"
      fill="#6366f1"
      text-anchor="middle"
      letter-spacing="1">brintodas</text>

    <!-- Border -->
    <rect width="900" height="220" rx="16" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  </g>
</svg>
