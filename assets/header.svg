<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep cosmic dark base -->
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020510"/>
      <stop offset="50%" stop-color="#060d1f"/>
      <stop offset="100%" stop-color="#020510"/>
    </linearGradient>
    <!-- Neon electric blue-violet glow -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <!-- Subtle pulse glow -->
    <radialGradient id="glowLeft" cx="0%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#020510" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="100%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#020510" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#020510" stop-opacity="0"/>
    </radialGradient>
    <!-- Grid line fade -->
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.04"/>
    </linearGradient>
    <!-- Scanline pattern -->
    <pattern id="scanlines" x="0" y="0" width="900" height="4" patternUnits="userSpaceOnUse">
      <rect width="900" height="1" fill="#38bdf8" opacity="0.02"/>
    </pattern>
    <!-- Dot grid -->
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.7" fill="#818cf8" opacity="0.25"/>
    </pattern>
    <!-- Clip for rounded corners -->
    <clipPath id="roundClip">
      <rect width="900" height="280" rx="18"/>
    </clipPath>
    <!-- Text glow filter -->
    <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Soft outer glow for decorative elements -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Border gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Shimmer for the line accent -->
    <linearGradient id="lineShimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#020510" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020510" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#roundClip)">
    <!-- Base background -->
    <rect width="900" height="280" fill="url(#bg)"/>

    <!-- Ambient glows -->
    <rect width="900" height="280" fill="url(#glowLeft)"/>
    <rect width="900" height="280" fill="url(#glowRight)"/>
    <rect width="900" height="280" fill="url(#glowCenter)"/>

    <!-- Dot grid texture -->
    <rect width="900" height="280" fill="url(#dots)"/>

    <!-- Scanlines -->
    <rect width="900" height="280" fill="url(#scanlines)"/>

    <!-- Horizontal grid lines -->
    <line x1="0" y1="70" x2="900" y2="70" stroke="url(#gridFade)" stroke-width="0.6"/>
    <line x1="0" y1="140" x2="900" y2="140" stroke="url(#gridFade)" stroke-width="0.6"/>
    <line x1="0" y1="210" x2="900" y2="210" stroke="url(#gridFade)" stroke-width="0.6"/>

    <!-- Vertical grid lines -->
    <line x1="225" y1="0" x2="225" y2="280" stroke="url(#gridFade)" stroke-width="0.6"/>
    <line x1="450" y1="0" x2="450" y2="280" stroke="url(#gridFade)" stroke-width="0.6"/>
    <line x1="675" y1="0" x2="675" y2="280" stroke="url(#gridFade)" stroke-width="0.6"/>

    <!-- Corner accent — top left -->
    <line x1="30" y1="20" x2="80" y2="20" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" filter="url(#softGlow)"/>
    <line x1="30" y1="20" x2="30" y2="70" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" filter="url(#softGlow)"/>
    <circle cx="30" cy="20" r="2.5" fill="#38bdf8" opacity="0.9" filter="url(#softGlow)"/>

    <!-- Corner accent — top right -->
    <line x1="870" y1="20" x2="820" y2="20" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.7" filter="url(#softGlow)"/>
    <line x1="870" y1="20" x2="870" y2="70" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.7" filter="url(#softGlow)"/>
    <circle cx="870" cy="20" r="2.5" fill="#c084fc" opacity="0.9" filter="url(#softGlow)"/>

    <!-- Corner accent — bottom left -->
    <line x1="30" y1="260" x2="80" y2="260" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" filter="url(#softGlow)"/>
    <line x1="30" y1="260" x2="30" y2="210" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" filter="url(#softGlow)"/>
    <circle cx="30" cy="260" r="2.5" fill="#38bdf8" opacity="0.9" filter="url(#softGlow)"/>

    <!-- Corner accent — bottom right -->
    <line x1="870" y1="260" x2="820" y2="260" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.7" filter="url(#softGlow)"/>
    <line x1="870" y1="260" x2="870" y2="210" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.7" filter="url(#softGlow)"/>
    <circle cx="870" cy="260" r="2.5" fill="#c084fc" opacity="0.9" filter="url(#softGlow)"/>

    <!-- Floating orbs — left -->
    <circle cx="80" cy="140" r="55" fill="#38bdf8" fill-opacity="0.04"/>
    <circle cx="80" cy="140" r="35" fill="#38bdf8" fill-opacity="0.06"/>
    <circle cx="80" cy="140" r="18" fill="#38bdf8" fill-opacity="0.09"/>

    <!-- Floating orbs — right -->
    <circle cx="820" cy="140" r="55" fill="#c084fc" fill-opacity="0.04"/>
    <circle cx="820" cy="140" r="35" fill="#c084fc" fill-opacity="0.06"/>
    <circle cx="820" cy="140" r="18" fill="#c084fc" fill-opacity="0.09"/>

    <!-- STATUS chip -->
    <rect x="370" y="36" width="160" height="22" rx="11" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.5"/>
    <circle cx="387" cy="47" r="4" fill="#4ade80" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="450" y="51.5" font-family="'Courier New', monospace" font-size="9" fill="#94a3b8" text-anchor="middle" letter-spacing="2">AVAILABLE TO BUILD</text>

    <!-- ── MAIN NAME ── -->
    <text x="450" y="108"
      font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
      font-size="58"
      font-weight="800"
      fill="url(#nameGrad)"
      text-anchor="middle"
      letter-spacing="-1"
      filter="url(#textGlow)">BRINTO DAS</text>

    <!-- Shimmer line under name -->
    <rect x="100" y="118" width="700" height="1.5" rx="1" fill="url(#lineShimmer)"/>

    <!-- ── TAGLINE ── -->
    <text x="450" y="152"
      font-family="'Courier New', Courier, monospace"
      font-size="13"
      fill="#64748b"
      text-anchor="middle"
      letter-spacing="4">DEVELOPER  ·  BUILDER  ·  MAKER</text>

    <!-- ── SUBTITLE ── -->
    <text x="450" y="186"
      font-family="'Segoe UI', 'Inter', Arial, sans-serif"
      font-size="14.5"
      fill="#94a3b8"
      text-anchor="middle"
      letter-spacing="0.5">Crafting fast, clean web experiences — from first sketch to deployed.</text>

    <!-- CTA pill -->
    <rect x="360" y="208" width="180" height="30" rx="15" fill="none" stroke="url(#nameGrad)" stroke-width="1.2"/>
    <text x="450" y="228"
      font-family="'Courier New', monospace"
      font-size="10"
      fill="#818cf8"
      text-anchor="middle"
      letter-spacing="2.5">CURRENTLY: FLATFOLKS</text>

    <!-- Tiny decorative crosses -->
    <!-- top -->
    <line x1="449" y1="22" x2="449" y2="30" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="445" y1="26" x2="453" y2="26" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>
    <!-- bottom -->
    <line x1="449" y1="253" x2="449" y2="261" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="445" y1="257" x2="453" y2="257" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>

    <!-- Subtle left accent bars -->
    <rect x="30" y="120" width="40" height="2" rx="1" fill="#38bdf8" opacity="0.4"/>
    <rect x="30" y="126" width="25" height="2" rx="1" fill="#38bdf8" opacity="0.2"/>

    <!-- Subtle right accent bars -->
    <rect x="830" y="120" width="40" height="2" rx="1" fill="#c084fc" opacity="0.4"/>
    <rect x="845" y="126" width="25" height="2" rx="1" fill="#c084fc" opacity="0.2"/>

    <!-- Rounded border overlay -->
    <rect width="900" height="280" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="1"/>
  </g>
</svg>
